name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+-[0-9]+"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MISE_EXPERIMENTAL: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version is read from the tags with git describe.
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]] || {
            echo "::error::$TAG is not v<versionName>-<versionCode>"
            exit 1
          }
      - name: Decode the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.GODLO_KEYSTORE_BASE64 }}
        run: |
          [[ -n "$KEYSTORE_BASE64" ]] || {
            echo "::error::The GODLO_KEYSTORE_BASE64 secret is not set"
            exit 1
          }
          # Outside the checkout, so git describe does not report -dirty.
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "GODLO_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        env:
          GODLO_KEYSTORE_PASSWORD: ${{ secrets.GODLO_KEYSTORE_PASSWORD }}
          GODLO_KEY_ALIAS: ${{ secrets.GODLO_KEY_ALIAS }}
          GODLO_KEY_PASSWORD: ${{ secrets.GODLO_KEY_PASSWORD }}
        run: ./gradlew test assembleRelease
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          apk="godlo-${version%-*}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "$TAG" "$apk" "$apk.sha256" --title "$TAG" --generate-notes --verify-tag
      - if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
